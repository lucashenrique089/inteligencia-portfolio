name: Coleta diária de preços

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar bibliotecas
        run: pip install -r requirements.txt
      - name: Coletar preços
        run: python atualizar_publico.py
      - name: Salvar os dados novos
        run: |
          git config user.name "robo-de-coleta"
          git config user.email "actions@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "Coleta automática de $(date +'%d/%m/%Y %H:%M')"
          git push
